stages:
  - smoke
  - test
  - build

default:
  tags: [macos]

variables:
  PROJECT: "UX Feedback SDK.xcodeproj"
  TEST_SCHEME: "UXFeedbackSDKTests"
  SDK_SCHEME: "UXFeedbackSDK"
  TEST_DESTINATION: "platform=iOS Simulator,name=iPhone 17"

smoke:
  stage: smoke
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH'
  script:
    - sw_vers
    - echo "Active Xcode:" && xcode-select -p
    - xcodebuild -version
    - echo "Runner OK"

test:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  script:
    - set -o pipefail
    # 4 известных легаси-падения исключены до их починки (см. TEST_COVERAGE_REPORT.md)
    - echo "SKIPPED (known legacy failures): APIWebRouterTests/testHeadersWithSettings, NSAttributedStringExtensionTests/testHeightForEmptyString, UIColorHexTests/testInvalidLengthThrows, PrivacyTests/testPrivacyCodable"
    - xcodebuild test
        -project "$PROJECT"
        -scheme "$TEST_SCHEME"
        -destination "$TEST_DESTINATION"
        -resultBundlePath build/tests.xcresult
        TEST_HOST= BUNDLE_LOADER=
        -skip-testing:UXFeedbackSDKTests/APIWebRouterTests/testHeadersWithSettings
        -skip-testing:UXFeedbackSDKTests/NSAttributedStringExtensionTests/testHeightForEmptyString
        -skip-testing:UXFeedbackSDKTests/UIColorHexTests/testInvalidLengthThrows
        -skip-testing:UXFeedbackSDKTests/PrivacyTests/testPrivacyCodable
  retry:
    max: 1
    when: script_failure
  artifacts:
    when: always
    paths:
      - build/tests.xcresult
    expire_in: 7 days

build_xcframework:
  stage: build
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - sh framework_build.command
    - ditto -c -k --sequesterRsrc --keepParent
        "UXFeedbackSDK_XCFramework/UXFeedbackSDK.xcframework"
        "UXFeedbackSDK.xcframework.zip"
    - shasum -a 256 UXFeedbackSDK.xcframework.zip
  artifacts:
    paths:
      - UXFeedbackSDK.xcframework.zip
    expire_in: 30 days
