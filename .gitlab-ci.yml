stages:
  - smoke
  - test
  - build
  - publish

default:
  tags: [macos]

variables:
  PROJECT: "UX Feedback SDK.xcodeproj"
  TEST_SCHEME: "UXFeedbackSDKTests"
  SDK_SCHEME: "UXFeedbackSDK"
  TEST_DESTINATION: "platform=iOS Simulator,name=iPhone 17"

smoke:
  stage: smoke
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH'
  script:
    - sw_vers
    - echo "Active Xcode:" && xcode-select -p
    - xcodebuild -version
    - echo "Runner OK"

test:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  script:
    - set -o pipefail
    - echo "SKIPPED known legacy failures - see TEST_COVERAGE_REPORT.md"
    - xcodebuild test -project "$PROJECT" -scheme "$TEST_SCHEME" -destination "$TEST_DESTINATION" -resultBundlePath build/tests.xcresult IPHONEOS_DEPLOYMENT_TARGET=15.0 TEST_HOST= BUNDLE_LOADER= -skip-testing:UXFeedbackSDKTests/APIWebRouterTests/testHeadersWithSettings -skip-testing:UXFeedbackSDKTests/NSAttributedStringExtensionTests/testHeightForEmptyString -skip-testing:UXFeedbackSDKTests/UIColorHexTests/testInvalidLengthThrows -skip-testing:UXFeedbackSDKTests/PrivacyTests/testPrivacyCodable
  retry:
    max: 1
    when: script_failure
  artifacts:
    when: always
    paths:
      - build/tests.xcresult
    expire_in: 7 days

.build_rules: &build_rules
  - if: '$CI_COMMIT_TAG'
  - if: '$CI_PIPELINE_SOURCE == "web"'
  - if: '$CI_COMMIT_BRANCH == "dev"'
  - if: '$CI_COMMIT_BRANCH == "main"'
  - if: '$CI_COMMIT_BRANCH =~ /^release\//'

build_uxfeedback:
  stage: build
  rules: *build_rules
  script:
    - sh framework_build.command
    - ditto -c -k --sequesterRsrc --keepParent "UXFeedbackSDK_XCFramework/UXFeedbackSDK.xcframework" "UXFeedbackSDK.xcframework.zip"
    - shasum -a 256 UXFeedbackSDK.xcframework.zip
  artifacts:
    paths:
      - UXFeedbackSDK.xcframework.zip
    expire_in: 30 days

build_yohe:
  stage: build
  rules: *build_rules
  script:
    - sh framework_build_YoHe.command
    - ditto -c -k --sequesterRsrc --keepParent "YoHeSDK_XCFramework/YoHeSDK.xcframework" "YoHeSDK.xcframework.zip"
    - shasum -a 256 YoHeSDK.xcframework.zip
  artifacts:
    paths:
      - YoHeSDK.xcframework.zip
    expire_in: 30 days

publish:
  stage: publish
  rules: *build_rules
  needs: [build_uxfeedback, build_yohe]
  script:
    - VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_REF_SLUG}"
    - echo "Publishing version $VERSION"
    - 'curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file UXFeedbackSDK.xcframework.zip "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/uxfeedbacksdk/$VERSION/UXFeedbackSDK.xcframework.zip"'
    - 'curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file YoHeSDK.xcframework.zip "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/uxfeedbacksdk/$VERSION/YoHeSDK.xcframework.zip"'
