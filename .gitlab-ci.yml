stages:
  - smoke
  - test
  - build
  - publish

default:
  tags: [macos]

variables:
  DEVELOPER_DIR: "/Applications/Xcode-26.3.0.app/Contents/Developer"
  PROJECT: "UX Feedback SDK.xcodeproj"
  TEST_SCHEME: "UXFeedbackSDKTests"
  SDK_SCHEME: "UXFeedbackSDK"
  TEST_SIM_NAME: "iPhone 17"
  TEST_SIM_OS_PREFIX: "26."

smoke:
  stage: smoke
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH'
  script:
    - sw_vers
    - echo "Active Xcode:" && xcode-select -p
    - xcodebuild -version
    - echo "Runner OK"

test:
  stage: test
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  script:
    - set -o pipefail
    - echo "SKIPPED known legacy failures - see TEST_COVERAGE_REPORT.md"
    - 'UDID=$(xcrun simctl list devices available | sed -n "/-- iOS ${TEST_SIM_OS_PREFIX}/,/^-- /p" | grep "${TEST_SIM_NAME} (" | grep -oE "[0-9A-F-]{36}" | head -1)'
    - 'echo "Simulator: ${TEST_SIM_NAME} iOS ${TEST_SIM_OS_PREFIX}x UDID=$UDID"; test -n "$UDID"'
    - xcodebuild test -project "$PROJECT" -scheme "$TEST_SCHEME" -destination "id=$UDID" -resultBundlePath build/tests.xcresult BUILD_LIBRARY_FOR_DISTRIBUTION=NO TEST_HOST= BUNDLE_LOADER= -skip-testing:UXFeedbackSDKTests/APIWebRouterTests/testHeadersWithSettings -skip-testing:UXFeedbackSDKTests/NSAttributedStringExtensionTests/testHeightForEmptyString -skip-testing:UXFeedbackSDKTests/UIColorHexTests/testInvalidLengthThrows -skip-testing:UXFeedbackSDKTests/PrivacyTests/testPrivacyCodable
  retry:
    max: 1
    when: script_failure
  artifacts:
    when: always
    paths:
      - build/tests.xcresult
    expire_in: 7 days

.build_rules: &build_rules
  - if: '$CI_COMMIT_TAG'
  - if: '$CI_PIPELINE_SOURCE == "web"'
  - if: '$CI_COMMIT_BRANCH == "dev"'
  - if: '$CI_COMMIT_BRANCH == "main"'
  - if: '$CI_COMMIT_BRANCH =~ /^release\//'

.apply_version: &apply_version
  - if [ -n "${CI_COMMIT_TAG:-}" ]; then export SDK_VERSION="${CI_COMMIT_TAG#v}"; sh scripts/apply_version.sh "$SDK_VERSION"; fi

build_uxfeedback:
  stage: build
  rules: *build_rules
  script:
    - *apply_version
    - sh framework_build.command
    - ditto -c -k --sequesterRsrc --keepParent "UXFeedbackSDK_XCFramework/UXFeedbackSDK.xcframework" "UXFeedbackSDK.xcframework.zip"
    - shasum -a 256 UXFeedbackSDK.xcframework.zip
  artifacts:
    paths:
      - UXFeedbackSDK.xcframework.zip
    expire_in: 30 days

build_yohe:
  stage: build
  rules: *build_rules
  script:
    - *apply_version
    - sh framework_build_YoHe.command
    - ditto -c -k --sequesterRsrc --keepParent "YoHeSDK_XCFramework/YoHeSDK.xcframework" "YoHeSDK.xcframework.zip"
    - shasum -a 256 YoHeSDK.xcframework.zip
  artifacts:
    paths:
      - YoHeSDK.xcframework.zip
    expire_in: 30 days

publish:
  stage: publish
  rules: *build_rules
  needs: [build_uxfeedback, build_yohe]
  script:
    - VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_REF_SLUG}"
    - echo "Publishing version $VERSION"
    - 'curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file UXFeedbackSDK.xcframework.zip "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/uxfeedbacksdk/$VERSION/UXFeedbackSDK.xcframework.zip"'
    - 'curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file YoHeSDK.xcframework.zip "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/uxfeedbacksdk/$VERSION/YoHeSDK.xcframework.zip"'

trigger_testapp:
  stage: publish
  needs: [publish]
  rules: *build_rules
  script:
    - VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_REF_SLUG}"
    - 'curl --fail-with-body -X POST -F "token=$TESTAPP_TRIGGER_TOKEN" -F "ref=main" -F "variables[SDK_VERSION]=$VERSION" "$CI_API_V4_URL/projects/$TESTAPP_PROJECT_ID/trigger/pipeline"'
